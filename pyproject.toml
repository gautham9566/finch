[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finch"
version = "0.2.0"
description = "Indian equity intraday stock-selection research and paper-trading platform"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.1.3",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "polars==1.14.0",
    "pyarrow==17.0.0",
    "pyyaml==6.0.2",
    "pydantic==2.9.2",
    "requests==2.32.3",
    "feedparser==6.0.11",
    "yfinance==0.2.50",
    "scikit-learn==1.5.2",
    "lightgbm==4.5.0",
    "xgboost==2.1.2",
    "psycopg[binary]==3.2.3",
    "sqlalchemy==2.0.36",
    "mlflow==2.17.2",
    "apscheduler==3.10.4",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "google-cloud-storage==2.18.2",
    "google-cloud-secret-manager==2.21.1",
    "google-cloud-monitoring==2.23.0",
    "google-cloud-bigquery==3.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "types-PyYAML==6.0.12.20240917",
    "types-requests==2.32.0.20241016",
]

[tool.setuptools]
packages = ["libs", "libs.common", "pipelines", "pipelines.data", "pipelines.training", "pipelines.training.agents", "pipelines.sandbox", "web", "web.backend"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
