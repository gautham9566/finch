[project]
name = "finch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "pyarrow>=18.0.0",
    "google-cloud-storage>=2.18.0",
    "nselib>=2.4.0",
    "yfinance>=0.2.50",
    "kaggle>=1.6.17",
    "psycopg[binary]>=3.2.0",
    "mlflow>=2.17.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.7.0"]
