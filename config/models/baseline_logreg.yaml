name: baseline_logreg
model_type: logreg
agent: momentum
is_baseline: true
enabled: true
features:
  - opening_gap_pct
  - prev_1d_return
  - prev_5d_return
  - prev_day_range_pct
  - volume_ratio_20d
  - atr_14_pct
  - dist_20d_high_pct
  - dist_20d_low_pct
  - rel_strength_nifty_5d
  - rel_strength_sector_5d
  - india_vix_level
  - india_vix_change_1d
  - us_overnight_return
  - asia_morning_return
  - crude_usdinr_yield_composite
  - news_sentiment_score
params:
  C: 0.25
  max_iter: 500
  class_weight: balanced
walk_forward:
  n_folds: 4
  min_train_days: 250
  val_days: 60
  test_holdout_days: 90
  purge_days: 2
