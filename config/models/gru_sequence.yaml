name: gru_sequence
model_type: gru_sequence
agent: momentum
is_baseline: false
enabled: true
features:
  - opening_gap_pct
  - prev_1d_return
  - prev_5d_return
  - prev_day_range_pct
  - volume_ratio_20d
  - atr_14_pct
  - rel_strength_nifty_5d
  - india_vix_change_1d
params:
  seq_len: 10
  hidden_size: 16
  epochs: 8
  batch_size: 256
  lr: 0.002
  weight_decay: 0.001
  device: cpu
  random_state: 42
walk_forward:
  n_folds: 4
  min_train_days: 250
  val_days: 60
  test_holdout_days: 90
  purge_days: 2
