<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finch — Research & Paper Trading Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/workbench.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary Navigation">
      <div class="brand">
        <img src="/favicon.svg" alt="" width="24" height="24" />
        <div>
          <div class="brand-name">Finch</div>
          <div class="brand-sub">NSE Paper Monitor</div>
        </div>
      </div>

      <nav class="nav-list" id="nav-list">
        <a class="nav-item customer-nav-link" href="/customer/">Customer interface ↗</a>
        <button class="nav-item active" data-page="overview" type="button">Overview</button>
        <button class="nav-item" data-page="data" type="button">Data</button>
        <button class="nav-item" data-page="models" type="button">Models</button>
        <button class="nav-item" data-page="agents" type="button">Agents</button>
        <button class="nav-item" data-page="rankings" type="button">Rankings</button>
        <button class="nav-item" data-page="sandbox" type="button">Sandbox</button>
        <button class="nav-item" data-page="jobs" type="button">Jobs</button>
        <button class="nav-item" data-page="cloud-resources" type="button">Cloud Resources</button>
        <button class="nav-item" data-page="cloud-billing" type="button">Cloud Billing</button>
      </nav>

      <div class="sidebar-meta">
        <label class="form-field">Strategy<select id="profile-select"><option value="minute">Minute · 09:30 IST</option><option value="hourly">Hourly · 10:15 IST</option></select></label>
        <div class="meta-row"><span>Host</span><strong class="mono">LOCAL</strong></div>
        <div class="meta-row"><span>Mode</span><strong class="mono">RESEARCH</strong></div>
        <div class="meta-row"><span>Execution</span><strong class="mono">PAPER ONLY</strong></div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="page-title">Overview</h1>
          <span class="pill pill-neutral" id="status-mode">PAPER SANDBOX</span>
          <span class="pill pill-neutral" id="status-quality">DATABASE: --</span>
          <span class="pill pill-warn" id="status-kill">NO VALIDATED EDGE</span>
        </div>
        <div class="topbar-right">
          <span class="mono muted" id="last-updated">IST --</span>
          <button class="btn" id="refresh-btn" type="button">Refresh</button>
          <button class="btn" id="theme-btn" type="button">Dark</button>
        </div>
      </header>

      <main class="content" id="content" aria-live="polite">
        <div class="loading-box">Loading local research and paper portfolios...</div>
      </main>

      <footer class="footer">
        <span>Finch · Local research workbench</span>
        <span class="muted">Virtual portfolios · No live broker orders</span>
      </footer>
    </div>
  </div>
  <script src="/workbench.js" defer></script>
</body>
</html>
